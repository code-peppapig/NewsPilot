<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简报详情 - NewsPilot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .header { margin-bottom: 30px; }
        .back-link { color: #4a6cf7; text-decoration: none; font-size: 14px; margin-bottom: 20px; display: inline-block; }
        .back-link:hover { text-decoration: underline; }
        .meta { color: #666; font-size: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .meta span { margin-right: 20px; }
        .content { background: white; border-radius: 12px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .content h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 8px; }
        .content h2 { font-size: 20px; color: #1a1a2e; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 2px solid #4a6cf7; }
        .content h3 { font-size: 17px; color: #333; margin: 24px 0 12px; }
        .content p { margin-bottom: 16px; }
        .content ul, .content ol { margin-bottom: 16px; padding-left: 24px; }
        .content li { margin-bottom: 8px; }
        .content blockquote { border-left: 4px solid #4a6cf7; padding-left: 16px; margin: 16px 0; color: #555; background: #f8f9ff; padding: 16px; border-radius: 0 8px 8px 0; }
        .content code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: "SF Mono", Consolas, monospace; font-size: 13px; }
        .content pre { background: #f0f0f0; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
        .content pre code { background: none; padding: 0; }
        .content hr { border: none; border-top: 1px solid #eee; margin: 24px 0; }
        .content a { color: #4a6cf7; text-decoration: none; }
        .content a:hover { text-decoration: underline; }
        .file-path { background: #f8f9fa; padding: 12px 16px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #666; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/briefings" class="back-link">← 返回简报列表</a>

        <div class="header">
            <h1 th:text="'AI 新闻简报 - ' + ${briefing.briefingDate}">AI 新闻简报 - 2026-10-09</h1>
        </div>

        <div class="meta">
            <span>📅 日期：<span th:text="${briefing.briefingDate}">2026-10-09</span></span>
            <span th:if="${briefing.filePath != null}">📁 文件：<span th:text="${briefing.filePath}">path</span></span>
        </div>

        <div class="content" th:utext="${briefing.content}">
            <!-- 简报 Markdown 内容渲染在这里 -->
        </div>
    </div>
</body>
</html>
