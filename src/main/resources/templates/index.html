<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsPilot - 每日 AI 新闻助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 8px; }
        .header p { color: #666; font-size: 16px; }
        .nav { display: flex; gap: 16px; justify-content: center; margin-bottom: 40px; }
        .nav a { padding: 12px 24px; background: #4a6cf7; color: white; text-decoration: none; border-radius: 8px; font-weight: 500; transition: background 0.2s; }
        .nav a:hover { background: #3a5ce5; }
        .nav a.secondary { background: #fff; color: #4a6cf7; border: 1px solid #4a6cf7; }
        .nav a.secondary:hover { background: #f0f3ff; }
        .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .card h2 { font-size: 20px; margin-bottom: 20px; color: #1a1a2e; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #444; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #4a6cf7; }
        .btn { display: inline-block; padding: 12px 32px; background: #4a6cf7; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #3a5ce5; }
        .user-list { margin-top: 24px; }
        .user-list table { width: 100%; border-collapse: collapse; }
        .user-list th, .user-list td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .user-list th { font-weight: 600; color: #666; font-size: 13px; text-transform: uppercase; }
        .empty { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NewsPilot</h1>
            <p>每日 AI 新闻助手 · 自动整理 · 精准推送</p>
        </div>

        <div class="nav">
            <a href="/">首页</a>
            <a href="/preferences" class="secondary">订阅偏好</a>
            <a href="/briefings" class="secondary">历史简报</a>
        </div>

        <div class="card">
            <h2>填写身份信息</h2>
            <form method="post" action="/user">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" placeholder="张三" required>
                </div>
                <div class="form-group">
                    <label for="identity">职业身份</label>
                    <input type="text" id="identity" name="identity" placeholder="Java 后端工程师" required>
                </div>
                <div class="form-group">
                    <label for="email">接收简报的邮箱</label>
                    <input type="email" id="email" name="email" placeholder="zhangsan@example.com" required>
                </div>
                <button type="submit" class="btn">保存并设置偏好</button>
            </form>
        </div>

        <div class="card" th:if="${not #lists.isEmpty(users)}">
            <h2>已注册用户</h2>
            <div class="user-list">
                <table>
                    <tr>
                        <th>姓名</th>
                        <th>身份</th>
                        <th>邮箱</th>
                    </tr>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.name}">张三</td>
                        <td th:text="${user.identity}">Java 后端工程师</td>
                        <td th:text="${user.email}">zhangsan@example.com</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="card empty" th:if="${#lists.isEmpty(users)}">
            暂无注册用户，请先填写上方表单创建用户
        </div>
    </div>
</body>
</html>
